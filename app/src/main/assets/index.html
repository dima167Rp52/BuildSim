<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1020"><title>BuildSim</title>
<style>
:root{--bg:#0b1020;--panel:#151d33;--panel2:#1d2945;--line:#2a3b60;--blue:#1977ff;--cyan:#45c9ff;--text:#eef4ff;--muted:#93a5c8;--green:#4be18b;--red:#ff6577}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 35% -20%,#1c3260 0,transparent 55%),var(--bg)}
header{height:62px;flex:none;display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:#10182b}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#238cff,#1745bc);display:grid;place-items:center;font-size:23px;box-shadow:0 5px 20px #1267ff55}.brand{font-size:19px;font-weight:900;letter-spacing:.2px}.tag{font-size:10px;color:var(--muted)}.grow{flex:1}
.topbtn,.run{border-radius:12px;padding:10px 14px;background:#1c2a49;border:1px solid #344b79;font-weight:800}.run{background:linear-gradient(135deg,#167aff,#2454dc);box-shadow:0 4px 18px #1267ff55}
main{min-height:0;flex:1;display:flex;gap:10px;padding:10px}
#tools{width:48px;flex:none;display:flex;flex-direction:column;gap:7px}
.tool{height:46px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:20px}.tool.active{background:#153c7d;border-color:#278bff;box-shadow:0 0 0 2px #167aff33}
#stage{position:relative;min-width:0;flex:1;border:1px solid #293b61;border-radius:15px;overflow:hidden;background-color:#101a30;background-image:linear-gradient(#26365377 1px,transparent 1px),linear-gradient(90deg,#26365377 1px,transparent 1px);background-size:28px 28px;touch-action:none}
#world{position:absolute;left:0;top:0;width:2400px;height:1800px;transform-origin:0 0}
.part{position:absolute;min-width:70px;min-height:56px;padding:8px 9px;border:2px solid #667da8;border-radius:10px;background:linear-gradient(145deg,#34496d,#1d2b47);box-shadow:0 6px 14px #0008;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;font-size:24px;user-select:none;touch-action:none}
.part small{font-size:10px;font-weight:800;color:#d9e7ff;white-space:nowrap}.part.selected{outline:2px solid #42b9ff;box-shadow:0 0 0 4px #248bff44,0 8px 18px #0009}.part.decor{background:linear-gradient(145deg,#6d7890,#3a465e);border-color:#9eabc3}
#hint{position:absolute;top:12px;left:12px;max-width:220px;padding:9px 11px;background:#121d34dd;border:1px solid #344b79;border-radius:11px;color:#b8c9e9;font-size:11px;pointer-events:none}
#palette{width:220px;flex:none;background:#121b30;border:1px solid var(--line);border-radius:15px;padding:9px;display:flex;flex-direction:column;min-height:0}
.phead{font-weight:900;font-size:13px;margin:2px 3px 8px}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-bottom:8px}.tab{padding:8px 3px;border-radius:9px;background:#1a2741;color:var(--muted);font-size:11px;font-weight:800}.tab.active{background:#174c9c;color:white}
#items{overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;align-content:start}
.item{min-height:66px;border:1px solid #293b60;border-radius:10px;background:#1a2741;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;font-size:23px;padding:5px}.item:active{border-color:#48aaff;background:#203d6b}.item span{font-size:10px;color:#dce8ff;font-weight:700}
footer{height:58px;flex:none;display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid var(--line);background:#10182b}
#status{flex:1;min-width:0;font-size:11px;color:var(--muted);line-height:1.4}#status strong{color:var(--green)}.footbtn{background:#1a2741;border:1px solid #344b79;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:800}
#props{position:absolute;bottom:10px;left:10px;right:10px;display:none;gap:8px;align-items:center;flex-wrap:wrap;padding:8px;background:#111b31ee;border:1px solid #3a527e;border-radius:12px;z-index:5;font-size:11px}#props.show{display:flex}#props button,#props select{background:#243657;border-radius:8px;padding:7px}input[type=color]{width:30px;height:28px;border:0;background:none}
#toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:9px 13px;background:#1c3154;border:1px solid #3e6098;border-radius:10px;font-size:12px;opacity:0;transition:.2s;pointer-events:none;z-index:10}#toast.show{opacity:1}
@media(max-width:650px){header{height:54px;padding:6px 9px}.tag{display:none}.brand{font-size:17px}.topbtn{padding:8px;font-size:11px}.run{padding:9px;font-size:11px}main{padding:6px;gap:6px}#tools{width:38px}.tool{height:40px;font-size:17px}#palette{width:116px;padding:6px}.phead{font-size:11px}.tabs{grid-template-columns:1fr 1fr}.tab{font-size:9px;padding:7px 1px}#items{grid-template-columns:1fr 1fr;gap:4px}.item{min-height:58px;font-size:19px}.item span{font-size:9px}#hint{max-width:145px;font-size:9px}footer{height:54px;padding:6px}.footbtn{padding:8px 9px;font-size:10px}}
@media(orientation:portrait) and (max-width:650px){main{flex-wrap:wrap}#tools{width:100%;height:36px;flex-direction:row} .tool{width:38px;height:34px}#stage{height:calc(100% - 150px);flex:1 1 100%}#palette{height:118px;width:100%;flex-direction:row;gap:7px}#palette .phead{display:none}#palette .tabs{width:74px;grid-template-columns:1fr;grid-template-rows:repeat(4,1fr);margin:0}#items{flex:1;grid-template-columns:repeat(4,minmax(0,1fr));overflow-x:auto;overflow-y:hidden}.item{min-width:55px}}
</style></head>
<body><div id="app">
<header><div class="logo">⬡</div><div><div class="brand">BuildSim</div><div class="tag">СТРОЙ • ПРОВЕРЯЙ • СОЗДАВАЙ</div></div><div class="grow"></div><button class="topbtn" id="save">Сохранить</button><button class="run" id="simulate">▶ Симуляция</button></header>
<main><div id="tools"><button class="tool active" data-tool="select" title="Выбор">↖</button><button class="tool" data-tool="pan" title="Перемещение поля">✥</button><button class="tool" id="rotate" title="Повернуть">⟳</button><button class="tool" id="delete" title="Удалить">⌫</button><button class="tool" id="expand" title="Расширить поле">＋</button></div>
<section id="stage"><div id="world"></div><div id="hint">Выбери деталь справа и нажми на поле, чтобы установить её. Перетаскивай детали пальцем.</div><div id="props"><b>Деталь:</b><input id="color" type="color" value="#7185a8"><select id="material"><option value="metal">Металл</option><option value="plastic">Пластик</option><option value="wood">Дерево</option><option value="glass">Стекло</option></select><button id="bigger">＋ Размер</button><button id="smaller">－ Размер</button><button id="done">Готово</button></div><div id="toast"></div></section>
<aside id="palette"><div class="phead">КАТАЛОГ ДЕТАЛЕЙ</div><div class="tabs"><button class="tab active" data-cat="electronics">⚡ Электроника</button><button class="tab" data-cat="mechanics">⚙ Механизмы</button><button class="tab" data-cat="pipes">♧ Трубы</button><button class="tab" data-cat="decor">▦ Декор</button></div><div id="items"></div></aside></main>
<footer><div id="status">🟦 Режим сборки · Деталей: <b id="count">0</b></div><button class="footbtn" id="reset">Сброс</button><button class="footbtn" id="zoomOut">－</button><button class="footbtn" id="zoomIn">＋</button></footer>
</div>
<script>
const catalog={
electronics:[['🔋','Батарея','battery'],['💡','Лампа','lamp'],['🔌','Провод','wire'],['🔘','Выключатель','switch'],['🧠','Микросхема','chip'],['🎚️','Резистор','resistor'],['🌡️','Датчик','sensor'],['⏱️','Таймер','timer']],
mechanics:[['⚙️','Шестерня','gear'],['🌀','Мотор','motor'],['🛞','Колесо','wheel'],['↕️','Поршень','piston'],['🌀','Вентилятор','fan'],['🚰','Насос','pump']],
pipes:[['🫙','Резервуар','tank'],['〰️','Труба','pipe'],['🚿','Клапан','valve'],['♨️','Нагреватель','heater'],['🧽','Фильтр','filter'],['☕','Кофейный блок','coffee']],
decor:[['🧱','Блок корпуса','block'],['▰','Панель','panel'],['🪟','Стекло','glass'],['📦','Короб','box'],['🪵','Дерево','wood'],['🔩','Крепёж','bolt']]
};
const world=document.getElementById('world'),stage=document.getElementById('stage'),items=document.getElementById('items'),props=document.getElementById('props'),status=document.getElementById('status');
let parts=[],selected=null,chosen=null,category='electronics',tool='select',scale=.72,ox=stage.clientWidth/2-500,oy=stage.clientHeight/2-350,drag=null,sim=false,switchOn=true;
const $=id=>document.getElementById(id);
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}
function drawWorld(){world.style.transform='translate('+ox+'px,'+oy+'px) scale('+scale+')';world.innerHTML='';parts.forEach(p=>{let d=document.createElement('div');d.className='part '+(p.type==='block'||p.type==='panel'||p.type==='glass'||p.type==='wood'?'decor':'')+(selected===p.id?' selected':'');d.style.left=p.x+'px';d.style.top=p.y+'px';d.style.width=p.w+'px';d.style.height=p.h+'px';d.style.borderColor=p.color||'#7185a8';if(p.material==='plastic')d.style.background='linear-gradient(145deg,#42618d,#20395e)';if(p.material==='wood')d.style.background='linear-gradient(145deg,#98704a,#60432c)';if(p.material==='glass')d.style.background='#64baff66';d.innerHTML='<div>'+p.icon+'</div><small>'+p.name+'</small>';d.dataset.id=p.id;d.addEventListener('pointerdown',e=>partDown(e,p));world.appendChild(d)});$('count').textContent=parts.length;updateProps()}
function renderItems(){items.innerHTML='';catalog[category].forEach(([icon,name,type])=>{let b=document.createElement('button');b.className='item';b.innerHTML=icon+'<span>'+name+'</span>';b.onclick=()=>{chosen={icon,name,type};toast('Выбрано: '+name+' · нажми на поле')};items.appendChild(b)})}
function setCategory(c){category=c;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.cat===c));renderItems()}
function addPart(x,y){if(!chosen)return;let [icon,name,type]=[chosen.icon,chosen.name,chosen.type];let p={id:Date.now()+Math.random(),x,y,icon,name,type,w:type==='wire'||type==='pipe'?110:82,h:type==='wire'||type==='pipe'?34:70,color:'#7185a8',material:'metal',size:1};parts.push(p);selected=p.id;drawWorld();toast(name+' добавлен')}
function partDown(e,p){e.stopPropagation();if(tool==='delete'){parts=parts.filter(q=>q.id!==p.id);selected=null;drawWorld();return}selected=p.id;drag={kind:'part',id:p.id,sx:e.clientX,sy:e.clientY,px:p.x,py:p.y};e.currentTarget.setPointerCapture(e.pointerId);drawWorld()}
stage.addEventListener('pointerdown',e=>{if(e.target.closest('#props'))return;let r=stage.getBoundingClientRect();if(chosen&&tool!=='pan'){let x=(e.clientX-r.left-ox)/scale,y=(e.clientY-r.top-oy)/scale;addPart(Math.round(x/28)*28,Math.round(y/28)*28);return}if(tool==='pan'||e.target===stage||e.target===world){drag={kind:'pan',sx:e.clientX,sy:e.clientY,ox,oy}}});
stage.addEventListener('pointermove',e=>{if(!drag)return;if(drag.kind==='part'){let p=parts.find(q=>q.id===drag.id);if(p){p.x=drag.px+(e.clientX-drag.sx)/scale;p.y=drag.py+(e.clientY-drag.sy)/scale;let el=world.querySelector('[data-id="'+p.id+'"]');if(el){el.style.left=p.x+'px';el.style.top=p.y+'px'}}}else{ox=drag.ox+e.clientX-drag.sx;oy=drag.oy+e.clientY-drag.sy;world.style.transform='translate('+ox+'px,'+oy+'px) scale('+scale+')'}});
stage.addEventListener('pointerup',()=>{if(drag&&drag.kind==='part')drawWorld();drag=null});
stage.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.25,Math.min(1.8,scale*(e.deltaY<0?1.1:.9)));drawWorld()},{passive:false});
function updateProps(){let p=parts.find(q=>q.id===selected);props.classList.toggle('show',!!p);if(p){$('color').value=p.color||'#7185a8';$('material').value=p.material||'metal'}}
$('color').oninput=e=>{let p=parts.find(q=>q.id===selected);if(p){p.color=e.target.value;drawWorld()}};$('material').onchange=e=>{let p=parts.find(q=>q.id===selected);if(p){p.material=e.target.value;drawWorld()}};
$('bigger').onclick=()=>resizePart(1.15);$('smaller').onclick=()=>resizePart(.87);function resizePart(k){let p=parts.find(q=>q.id===selected);if(p){p.w=Math.max(42,Math.min(220,p.w*k));p.h=Math.max(38,Math.min(180,p.h*k));drawWorld()}}
$('done').onclick=()=>{selected=null;drawWorld()};$('rotate').onclick=()=>{let p=parts.find(q=>q.id===selected);if(p){[p.w,p.h]=[p.h,p.w];drawWorld()}};$('delete').onclick=()=>{tool='delete';toast('Нажми на деталь, чтобы удалить')};
$('expand').onclick=()=>{let p=parts.find(q=>q.id===selected);if(p){p.w=Math.min(360,p.w+56);p.h=Math.min(260,p.h+28);drawWorld()}else{scale=Math.max(.25,scale*.88);ox+=30;oy+=20;drawWorld();toast('Рабочая область увеличена')}};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));chosen=null});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setCategory(b.dataset.cat));
$('zoomIn').onclick=()=>{scale=Math.min(1.8,scale*1.15);drawWorld()};$('zoomOut').onclick=()=>{scale=Math.max(.25,scale/1.15);drawWorld()};
function runSim(){sim=!sim;if(sim){let battery=parts.some(p=>p.type==='battery'),lamp=parts.some(p=>p.type==='lamp'),wire=parts.some(p=>p.type==='wire'),sw=parts.some(p=>p.type==='switch');if(battery&&lamp&&wire){status.innerHTML='<strong>● Симуляция запущена</strong> · '+(sw?'Переключатель: ВКЛ':'Цепь: условно замкнута')+' · Лампа '+(sw&&!switchOn?'выключена':'горит');}else if(parts.some(p=>p.type==='tank')&&parts.some(p=>p.type==='pump')&&parts.some(p=>p.type==='heater')){status.innerHTML='<strong>● Тест устройства</strong> · Найдены резервуар, насос и нагреватель';}else{status.innerHTML='⚠ Для теста добавь батарею, провод и лампу (или резервуар, насос и нагреватель).'}$('simulate').textContent='■ Остановить';}else{status.textContent='🟦 Режим сборки · Деталей: '+parts.length;$('simulate').textContent='▶ Симуляция'}}
$('simulate').onclick=runSim;
$('save').onclick=()=>{localStorage.setItem('buildsim-project',JSON.stringify(parts));toast('Проект сохранён на устройстве')};
$('reset').onclick=()=>{if(confirm('Удалить все детали с поля?')){parts=[];selected=null;sim=false;drawWorld();$('simulate').textContent='▶ Симуляция';status.textContent='🟦 Режим сборки · Поле очищено'}};
try{let saved=JSON.parse(localStorage.getItem('buildsim-project')||'[]');if(Array.isArray(saved))parts=saved}catch(e){}
renderItems();drawWorld();setTimeout(()=>{ox=stage.clientWidth/2-450;oy=stage.clientHeight/2-320;drawWorld()},100);
</script></body></html>
